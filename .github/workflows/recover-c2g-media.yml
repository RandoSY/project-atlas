name: Recover original C2G exhibit images
on:
  push:
    branches: [atlas-web-preview]
    paths: ['.github/workflows/recover-c2g-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-web-preview
      - name: Install image verifier
        run: python3 -m pip install Pillow
      - name: Recover exact missing files
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, hashlib
          from PIL import Image
          root=pathlib.Path('web/atlas/circuits-to-genomes/media')
          root.mkdir(parents=True,exist_ok=True)
          origin='https://project-atlas-lab.duckdns.org/atlas/circuits-to-genomes/media/'
          names=['pdp8.jpg','continuity.png','networks.png','equivalence.png','precision.png','framework.png']
          for name in names:
              target=root/name
              if not target.exists():
                  request=urllib.request.Request(origin+name,headers={'User-Agent':'Project-ATLAS-archive-recovery/1.0'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      data=response.read(20_000_001)
                  assert 0<len(data)<=20_000_000, name
                  from io import BytesIO
                  with Image.open(BytesIO(data)) as im:
                      assert im.format==('JPEG' if name.endswith('.jpg') else 'PNG'), name
                      im.verify()
                  target.write_bytes(data)
              print(hashlib.sha256(target.read_bytes()).hexdigest(),name)
          PY
          git add -- web/atlas/circuits-to-genomes/media/{pdp8.jpg,continuity.png,networks.png,equivalence.png,precision.png,framework.png}
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Restore original C2G exhibit image assets from legacy public site'
            git push origin HEAD:atlas-web-preview
          fi
