name: Publish Project ATLAS

on:
  push:
    branches: [atlas-web-preview]
    paths:
      - 'web/atlas/**'
      - 'web/releases/catalase-open-lab/v1.1/**'
      - '.github/workflows/atlas-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-web-preview
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Stage only the public Atlas site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, shutil, hashlib, zipfile
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          src = Path('web/atlas')
          out = Path('_site')
          base = os.environ['BASE_PATH'].rstrip('/')
          origin = 'https://project-atlas-lab.duckdns.org'
          assert (src / 'index.html').is_file()
          for name in ['pdp8.jpg','continuity.png','networks.png','equivalence.png','precision.png','framework.png']:
              assert (src / 'circuits-to-genomes/media' / name).stat().st_size > 0, name
          assert not any(p.is_symlink() for p in src.rglob('*')), 'Review symlinks before publishing'
          shutil.copytree(src, out / 'atlas')
          # Install the exact versioned Open Lab download package from the repository.
          release = Path('web/releases/catalase-open-lab/v1.1/Catalase_Open_Lab_v1.1.zip')
          data = release.read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'e2e0173c913f814d196a4c622f1ff1c8f0f8d471bb3c295bd0817e76537de84f', 'Catalase archive checksum mismatch'
          dest = out / 'atlas/catalase-fem/downloads/v1.1'
          dest.mkdir(parents=True, exist_ok=True)
          (dest / release.name).write_bytes(data)
          names = ['01_Teacher_Guide.pdf', '02_Student_Guide.pdf', '03_Theory_and_Research.pdf', 'START_HERE.txt', 'analyze.py', 'measurements_template.csv', 'balloon_template.csv']
          with zipfile.ZipFile(release) as z:
              assert z.testzip() is None
              for name in names:
                  (dest / name).write_bytes(z.read('catalase_open_lab/' + name))
          (dest / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((dest / name).read_bytes()).hexdigest() + '  ' + name + '\n' for name in [release.name, *names]), encoding='utf-8')
          (out / '.nojekyll').touch()
          (out / 'index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=atlas/"><title>Project Atlas</title><a href="atlas/">Open Project Atlas</a></html>', encoding='utf-8')
          for p in (out / 'atlas').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.css','.js','.mjs','.json','.svg','.xml','.webmanifest'}:
                  continue
              old = p.read_text(encoding='utf-8')
              new = re.sub(r'(?<![\w/.-])/atlas(?=/|["\x27])', lambda m: base + m[0], old)
              # Existing fully qualified Atlas links are migrated as well.
              new = new.replace(origin + '/atlas/', base + '/atlas/')
              # Calculus is a separate website; do not deploy or overwrite it.
              new = re.sub(r'(?<![\w/.-])/calculus(?=/|["\x27])', lambda m: origin + m[0], new)
              if new != old:
                  p.write_text(new, encoding='utf-8')
          # Discovery metadata is generated on the staged site, never in source exhibits.
          import html
          import xml.etree.ElementTree as ET
          from urllib.parse import quote
          public = 'https://randosy.github.io' + base
          root_url = public + '/atlas/'
          descriptions = {
              'catalase-fem/open-lab/index.html': 'An open catalase laboratory with downloadable teacher and student guides, experimental procedures, data templates and analysis tools.',
              'lazy-lidar/model.html': 'Interactive virtual robot laboratory for exploring sparse LiDAR measurements, motion and mapping.',
              'cutebot-motion-evidence/viewer.html': 'Interactive viewer for examining evidence of Cutebot robot motion.',
              'teatime/model.html': 'Interactive model for investigating the TeaTime experiment.',
              'water-clock/model.html': 'Interactive water clock model for investigating measurement and time.',
          }
          images = {
              'index.html': 'assets/randall-young.webp',
              'circuits-to-genomes/index.html': 'circuits-to-genomes/media/pdp8.jpg',
              'cutebot-motion-evidence/index.html': 'cutebot-motion-evidence/media/cutebot-card.webp',
              'fair-fitness-testing/index.html': 'fair-fitness-testing/media/android-test-complete.png',
              'instruments/index.html': 'instruments/screens/dvm-controls.webp',
              'lazy-lidar/index.html': 'lazy-lidar/media/virtual-lab.webp',
              'lazy-lidar/model.html': 'lazy-lidar/media/virtual-lab.webp',
              'pop-can-calorimeter/index.html': 'pop-can-calorimeter/media/apparatus.webp',
              'singing-rule/index.html': 'singing-rule/media/bench.webp',
              'sphericity-meter/index.html': 'sphericity-meter/media/bench.webp',
              'sqm-plus/index.html': 'sqm-plus/media/setup.webp',
              'teatime/index.html': 'teatime/media/dashboard.webp',
              'water-clock/index.html': 'water-clock/media/apparatus.webp',
          }
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_head = self.in_title = False
                  self.title = ''
                  self.meta = {}
                  self.canonical = False
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'head':
                      self.in_head = True
                  if not self.in_head:
                      return
                  if tag == 'title':
                      self.in_title = True
                  if tag == 'meta':
                      key = a.get('name') or a.get('property')
                      if key:
                          self.meta[key.lower()] = a.get('content', '')
                  if tag == 'link' and 'canonical' in (a.get('rel') or '').lower().split():
                      self.canonical = True
              def handle_endtag(self, tag):
                  if tag == 'head':
                      self.in_head = False
                  if tag == 'title':
                      self.in_title = False
              def handle_data(self, data):
                  if self.in_title:
                      self.title += data
          ns = 'http://www.sitemaps.org/schemas/sitemap/0.9'
          ET.register_namespace('', ns)
          sitemap = ET.Element('{'+ns+'}urlset')
          count = 0
          for p in sorted((out / 'atlas').rglob('*.html')):
              rel = p.relative_to(out / 'atlas').as_posix()
              page_path = rel[:-len('index.html')] if rel.endswith('/index.html') or rel == 'index.html' else rel
              url = root_url + quote(page_path, safe='/')
              content = p.read_text(encoding='utf-8')
              head = Head()
              head.feed(content)
              if not re.search(r'</head\s*>', content, re.I):
                  raise ValueError(f'HTML page has no closing head: {rel}')
              title = ' '.join(head.title.split()) or 'Project Atlas'
              desc = head.meta.get('description') or descriptions.get(rel) or f'{title}. Explore the exhibit and its resources in Project Atlas, an open scientific and educational archive.'
              tags = []
              def meta(key, value, attr='name'):
                  if key not in head.meta:
                      tags.append(f'<meta {attr}="{key}" content="{html.escape(value, quote=True)}">')
              if not head.canonical:
                  tags.append(f'<link rel="canonical" href="{html.escape(url, quote=True)}">')
              meta('description', desc)
              meta('og:type', 'website', 'property')
              meta('og:site_name', 'Project Atlas', 'property')
              meta('og:title', title, 'property')
              meta('og:description', desc, 'property')
              meta('og:url', url, 'property')
              image = images.get(rel)
              if image:
                  assert (out / 'atlas' / image).is_file(), image
                  meta('og:image', root_url + quote(image, safe='/'), 'property')
                  meta('twitter:image', root_url + quote(image, safe='/'))
              meta('twitter:card', 'summary' if not image or rel == 'index.html' else 'summary_large_image')
              meta('twitter:title', title)
              meta('twitter:description', desc)
              if tags:
                  content = re.sub(r'</head\s*>', lambda _: '\n' + '\n'.join(tags) + '\n</head>', content, count=1, flags=re.I)
                  p.write_text(content, encoding='utf-8')
              if not any(re.search(r'\b(?:noindex|none)\b', head.meta.get(key, ''), re.I) for key in ('robots', 'googlebot', 'bingbot')):
                  node = ET.SubElement(sitemap, '{'+ns+'}url')
                  ET.SubElement(node, '{'+ns+'}loc').text = url
                  count += 1
          ET.indent(sitemap)
          ET.ElementTree(sitemap).write(out / 'sitemap.xml', encoding='utf-8', xml_declaration=True)
          redirect = out / 'index.html'
          redirect.write_text(redirect.read_text(encoding='utf-8').replace('<title>', f'<link rel="canonical" href="{root_url}"><title>', 1), encoding='utf-8')
          print(f'Discovery: {count} indexable Atlas URLs in {public}/sitemap.xml')
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  self.refs.extend(v for k,v in attrs if k in ('href','src','poster') and v)
          missing = set()
          for p in (out / 'atlas').rglob('*.html'):
              page = Links()
              page.feed(p.read_text(encoding='utf-8'))
              for ref in page.refs:
                  url = urlsplit(ref)
                  if url.scheme or url.netloc or not url.path:
                      continue
                  if url.path.startswith('/'):
                      if base and not url.path.startswith(base + '/'):
                          missing.add((str(p), ref))
                          continue
                      target = out / unquote(url.path[len(base):].lstrip('/'))
                  else:
                      target = p.parent / unquote(url.path)
                  if target.is_dir():
                      target = target / 'index.html'
                  if not target.is_file():
                      missing.add((str(p), ref))
          for page, ref in sorted(missing):
              print(f'::warning::{page}: unresolved local reference {ref}')
          print(f'Local link audit: {len(missing)} unresolved references; review warnings.')
          print(f'Publishing {sum(p.is_file() for p in out.rglob("*"))} files.')
          PY
      - name: Render and validate successor handbook editions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-croscore fonts-noto-core
          python3 -m pip install --disable-pip-version-check weasyprint==68.0 pypdf
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from weasyprint import HTML
          from pypdf import PdfReader
          import hashlib
          root = Path('_site/atlas/handbook')
          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'img':
                      self.images.append(dict(attrs)['src'])
          checksums = []
          for version, source_name in [('1.1', 'index_v1.1_archive.html'), ('1.2', 'index_v1.2_archive.html'), ('1.2.1', 'index_v1.2.1_archive.html'), ('1.3', 'index_v1.3_archive.html'), ('2.0', 'index_v2.0_archive.html'), ('2.0.1', 'index_v2.0.1_archive.html'), ('2.0.2', 'index_v2.0.2_archive.html'), ('2.0.3', 'index.html')]:
              source = root / source_name
              p = Images()
              p.feed(source.read_text(encoding='utf-8'))
              assert len(p.images) == {'1.3': 37, '2.0': 47, '2.0.1': 37, '2.0.2': 25, '2.0.3': 25}.get(version, 36), (version, 'Missing handbook illustrations')
              if version in ('2.0.1', '2.0.2', '2.0.3'):
                  assert len(set(p.images)) == len(p.images), 'Repeated exhibit illustration'
              for src in p.images:
                  assert not urlsplit(src).scheme, src
                  asset = root / src
                  assert asset.is_file() and asset.stat().st_size > 0, src
              target = root / f'Project_Atlas_Successors_Curriculum_Handbook_v{version}.pdf'
              HTML(filename=str(source.resolve())).write_pdf(str(target))
              pdf = PdfReader(target)
              assert len(pdf.pages) == {'1.3': 19, '2.0': 24, '2.0.1': 24, '2.0.2': 24, '2.0.3': 24}.get(version, 18), f'Unexpected handbook v{version} pagination: {len(pdf.pages)}'
              assert target.stat().st_size > 200000, 'PDF unexpectedly small'
              assert 'Successor' in (pdf.pages[0].extract_text() or '')
              assert 'Keep the ideas alive' in (pdf.pages[-1].extract_text() or '')
              if version in ('1.2', '1.2.1', '1.3'):
                  contents = pdf.pages[1].extract_text() or ''
                  assert 'If you only do one thing' in contents and 'Terms:' in contents, 'Contents-page additions missing'
                  assert 'Begin with the world' in (pdf.pages[2].extract_text() or ''), 'Contents overflow'
              if version == '1.3':
                  lunar = pdf.pages[9].extract_text() or ''
                  assert 'From Parallax to Picoseconds' in lunar and 'Evidence of understanding' in lunar, 'Lunar lab missing or split'
                  assert 'Software-Defined Laboratory' in (pdf.pages[10].extract_text() or ''), 'Lunar lab overflow'
              if version in ('2.0', '2.0.1', '2.0.2', '2.0.3'):
                  expected = {
                      1: 'Successor', 2: 'Five levels. One method.',
                      3: 'LEVEL 1 / DISCOVER', 4: 'Begin with the world',
                      5: 'The method that holds it together', 6: 'Kitchen Inquiry Lab',
                      7: 'LEVEL 2 / MEASURE', 8: 'One Cup Chemistry',
                      9: 'Chemistry becomes biology', 10: 'NOTHING IS FREE',
                      11: 'The measured world', 12: 'From Parallax to Picoseconds',
                      13: 'LEVEL 3 / BUILD', 14: 'Software-Defined Laboratory',
                      15: 'Physical computing: bits to behavior', 16: 'Computing observatories',
                      17: 'Bargain Bin Robotics', 18: 'LEVEL 4 / APPLY',
                      19: 'Measure human performance', 20: 'LEVEL 5 / INVESTIGATE',
                      21: 'Mathematics becomes necessary', 22: 'From Circuits to Genomes',
                      23: 'The 24-week learning itinerary', 24: 'Keep the ideas alive',
                  }
                  import re
                  for number, phrase in expected.items():
                      content = re.sub(r'\s+', ' ', pdf.pages[number-1].extract_text() or '')
                      assert phrase.casefold() in content.casefold(), f'v2.0 page {number}: missing {phrase}'
                  for number in (3, 7, 13, 18, 20):
                      content = pdf.pages[number-1].extract_text() or ''
                      assert 'learning objectives' in content.casefold() and 'ready for the next level?' in content.casefold(), f'Incomplete division page {number}'
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              checksums.append(digest + '  ' + target.name + '\n')
              print(f'Handbook v{version}: {len(pdf.pages)} pages; {len(p.images)} image placements; {target.stat().st_size} bytes; SHA256 {digest}')
          (root / 'SHA256SUMS.txt').write_text(''.join(checksums), encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
