<g fill="#fff6df" font-size="34" font-weight="700"><text x="96" y="427">01 · Prescribe</text><text x="462" y="427">02 · Check</text><text x="828" y="427">03 · Observe</text></g>
<g fill="#b9e5da" font-size="23"><text x="96" y="467">Target external output</text><text x="462" y="467">Motion evidence</text><text x="828" y="467">Heart-rate response</text></g>
<text x="64" y="570" fill="#c5e4db" font-size="22">Three different questions. Three different kinds of evidence.</text>
