<title id="t">Three distinct jobs in Fair Fitness Testing</title><desc id="d">Prescribe an effort, check motion evidence, and observe the heart-rate response. Concept graphic, not a test record.</desc>
<rect width="1200" height="630" rx="22" fill="#113a3c"/>
<g font-family="system-ui,sans-serif">
<text x="64" y="78" fill="#a9ded0" font-size="25" font-weight="700" letter-spacing="4">FAIR FITNESS TESTING / CONCEPT</text>
<text x="64" y="151" fill="#fff6df" font-family="Georgia,serif" font-size="49" font-weight="700">Same motion. Same work?</text>
<g fill="#1a4a4b" stroke="#719e92" stroke-width="2"><rect x="64" y="208" width="340" height="300" rx="17"/><rect x="430" y="208" width="340" height="300" rx="17"/><rect x="796" y="208" width="340" height="300" rx="17"/></g>
<g stroke="#f3d084" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
