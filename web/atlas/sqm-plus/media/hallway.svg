<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" width="1280" height="610" role="img" aria-labelledby="t d">
<title id="t">One marked 11-meter hallway leg</title><desc id="d">Start and finish markers enclose the measured leg. Reset and turns are beyond the finish and excluded. The device times and records the leg while the browser displays the data.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c3540"/><stop offset="1" stop-color="#091c29"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M0 42V0H42" fill="none" stroke="#62b9b6" stroke-opacity=".2"/></pattern>
 <marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#efc069"/></marker>
</defs>
<rect width="1280" height="610" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1224" height="554" rx="20" fill="url(#grid)" stroke="#49757b"/>
<g font-family="system-ui,sans-serif">
 <text x="84" y="98" font-size="22" font-weight="700" fill="#89d8c8" letter-spacing="5">THE HALLWAY OBSERVATORY</text>
 <text x="84" y="182" font-size="62" fill="#f8f6ef" font-family="Georgia,serif">One marked leg.</text>
 <text x="84" y="225" font-size="26" fill="#c4e0df">Known distance · explicit endpoints · a separate IMU record</text>
 <rect x="84" y="285" width="1112" height="140" rx="16" fill="#153c48" stroke="#5d868a"/>
 <path d="M171 297v116M985 297v116" stroke="#89d8c8" stroke-width="7"/>
 <path d="M997 356h166" stroke="#8eaaa7" stroke-width="3" stroke-dasharray="7 10"/>
 <path d="M190 356H957" stroke="#efc069" stroke-width="4" marker-end="url(#arrow)"/>
 <rect x="493" y="322" width="170" height="66" rx="11" fill="#153c48"/>
 <text x="578" y="369" text-anchor="middle" font-size="48" font-weight="700" fill="#ffd88f">11.0 m</text>
 <text x="171" y="472" text-anchor="middle" font-size="25" font-weight="700" fill="#9ce7d2">START</text>
 <text x="985" y="472" text-anchor="middle" font-size="25" font-weight="700" fill="#9ce7d2">FINISH</text>
 <text x="1091" y="331" text-anchor="middle" font-size="17" fill="#c4d9d9">TURN / RESET</text>
 <text x="1091" y="393" text-anchor="middle" font-size="17" fill="#c4d9d9">not timed</text>
 <path d="M84 511h1112" stroke="#45747a"/>
 <text x="84" y="551" font-size="19" fill="#c4e0df">SQM+ · DISTANCE ÷ TIME FIRST. STEP CANDIDATES SECOND.</text>
</g>
</svg>
