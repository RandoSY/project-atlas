<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Different routes to peroxide management</title><desc id="desc">Catalase and reductant-dependent peroxidases contribute to peroxide control through different reactions and dependencies.</desc><rect width="800" height="420" fill="#edf4ef"/><g font-family="Arial,sans-serif" fill="#183b3d"><text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold">ONE REQUIREMENT · DIFFERENT IMPLEMENTATIONS</text><rect x="252" y="58" width="296" height="65" rx="9" fill="#153b3e"/><text x="400" y="85" text-anchor="middle" fill="white" font-size="20">Hydrogen peroxide</text><text x="400" y="108" text-anchor="middle" fill="#d5e7df" font-size="15">Production · transport · exposure</text><path d="M400 123V140H200V157M400 140H600V157" stroke="#477c72" stroke-width="3" fill="none"/><rect x="36" y="157" width="328" height="111" rx="9" fill="#fff" stroke="#52847a"/><rect x="436" y="157" width="328" height="111" rx="9" fill="#fff" stroke="#52847a"/><text x="200" y="186" text-anchor="middle" font-size="21" font-weight="bold">Catalase</text><text x="200" y="213" text-anchor="middle" font-size="19">2 H₂O₂ → 2 H₂O + O₂</text><text x="200" y="244" text-anchor="middle" font-size="14">No external reductant in this reaction</text><text x="600" y="186" text-anchor="middle" font-size="21" font-weight="bold">Peroxidases</text><text x="600" y="213" text-anchor="middle" font-size="18">H₂O₂ + reducing equivalents</text><text x="600" y="244" text-anchor="middle" font-size="14">Reductant regeneration required</text><path d="M200 268V290H400V311M600 268V290H400" stroke="#477c72" stroke-width="3" fill="none"/><rect x="148" y="311" width="504" height="70" rx="9" fill="#d0e4d7" stroke="#52847a"/><text x="400" y="338" text-anchor="middle" font-size="20" font-weight="bold">Physiologically tolerable peroxide exposure</text><text x="400" y="361" text-anchor="middle" font-size="14">Condition-dependent system capability · not identical reaction</text><text x="400" y="405" text-anchor="middle" font-size="12">Conceptual diagram, not a phylogeny or measured result</text></g></svg>